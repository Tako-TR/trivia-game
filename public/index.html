<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Player</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <!-- Confetti Canvas Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    .auth-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 1.5rem;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      text-align: left;
      margin: 1rem 0;
    }
    .auth-card label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .auth-card input {
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
    }
    .stats-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin: 1rem 0;
      text-align: center;
    }
    .stat-item h3 {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      margin: 0;
    }
    .stat-item p {
      font-size: 1.25rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 0.25rem 0 0 0;
    }
    .rank-badge-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #334155;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      margin: 0.75rem auto 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
      border: 1px solid #475569;
    }
    .player-answer-reveal {
      background-color: #064e3b;
      border: 2px solid #10b981;
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem 0;
    }
    .player-answer-label {
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: #6ee7b7;
      margin-bottom: 0.3rem;
    }
    .player-answer-text {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
    }
    .trivia-image-box {
      margin: 0.75rem auto;
      background-color: #ffffff;
      padding: 0.75rem;
      border-radius: 10px;
      display: inline-block;
    }
    .trivia-image {
      max-height: 140px;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }

    /* Player Mini Podium */
    .player-podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0.5rem;
      margin: 1rem auto 1.25rem;
      max-width: 320px;
      height: 160px;
    }
    .p-slot {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .p-slot.first { order: 2; }
    .p-slot.second { order: 1; }
    .p-slot.third { order: 3; }
    .p-icon { font-size: 1.4rem; }
    .p-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80px;
    }
    .p-step {
      width: 100%;
      border-radius: 8px 8px 0 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      color: #0f172a;
    }
    .p-slot.first .p-step { height: 80px; background: linear-gradient(180deg, #facc15, #ca8a04); }
    .p-slot.second .p-step { height: 60px; background: linear-gradient(180deg, #cbd5e1, #64748b); }
    .p-slot.third .p-step { height: 40px; background: linear-gradient(180deg, #fdba74, #c2410c); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Screen -->
    <div id="join-screen">
      <h1>Trivia Login</h1>
      <p class="question-text">Track your high scores & all-time career XP</p>
      
      <p id="auth-error" class="error-msg"></p>

      <form id="auth-form" class="auth-card">
        <div>
          <label for="username-input">Username</label>
          <input type="text" id="username-input" placeholder="e.g. Maverick" maxlength="20" required>
        </div>
        <div>
          <label for="pin-input">4-Digit PIN</label>
          <input type="password" id="pin-input" placeholder="e.g. 1234" maxlength="6" required>
        </div>
        <button type="submit" id="btn-login" style="background-color: #10b981; margin-top: 0.5rem;">Enter Arena</button>
      </form>
    </div>

    <!-- Lobby / Profile Screen -->
    <div id="lobby-screen" class="hidden">
      <h1>Ready, <span id="display-player-name" style="color: #38bdf8;"></span>!</h1>
      
      <div class="stats-card">
        <div class="stat-item">
          <h3>Single High Score</h3>
          <p id="stat-high-score">0</p>
        </div>
        <div class="stat-item">
          <h3>Career Points</h3>
          <p id="stat-career-score">0</p>
        </div>
      </div>

      <p class="question-text">Waiting for the host to launch the game...</p>
      <button id="btn-logout" style="background: none; border: 1px solid #475569; color: #94a3b8; padding: 0.4rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer;">Log Out / Switch User</button>
    </div>

    <!-- Active Question Screen -->
    <div id="game-screen" class="hidden">
      <div id="category-badge" class="badge">Category</div>
      <div id="timer" class="timer">15</div>

      <div id="player-image-container" class="trivia-image-box hidden">
        <img id="player-question-image" class="trivia-image" src="" alt="Trivia Visual">
      </div>

      <p id="question-text" class="question-text">Question text goes here</p>
      <div id="options-container" class="options-grid"></div>
      <p id="status-message" class="badge hidden">Answer Submitted</p>
    </div>

    <!-- Round End Screen -->
    <div id="results-screen" class="hidden">
      <h1>Round Results</h1>
      <p id="result-feedback" class="question-text" style="margin-bottom: 0.25rem; font-weight: 700;"></p>

      <div id="rank-indicator" class="rank-badge-box">
        <span>Game Rank:</span>
        <span id="player-rank-display" style="color:#38bdf8; font-size:1.3rem;">#--</span>
      </div>

      <!-- Mini Podium for Final Match Standings -->
      <div id="player-podium-area" class="player-podium hidden"></div>

      <div class="player-answer-reveal" id="answer-reveal-wrapper">
        <div class="player-answer-label">Correct Answer</div>
        <div id="player-correct-answer" class="player-answer-text">---</div>
      </div>

      <h2>Current Match Standings</h2>
      <ul id="leaderboard-list" class="leaderboard"></ul>
    </div>
  </div>

  <script>
    const socket = io();
    let selectedAnswer = null;

    // Tactile Vibration Helper (Safe for mobile browsers)
    function haptic(pattern) {
      if ('vibrate' in navigator) {
        try {
          navigator.vibrate(pattern);
        } catch (e) {}
      }
    }

    const joinScreen = document.getElementById('join-screen');
    const lobbyScreen = document.getElementById('lobby-screen');
    const gameScreen = document.getElementById('game-screen');
    const resultsScreen = document.getElementById('results-screen');

    const authForm = document.getElementById('auth-form');
    const usernameInput = document.getElementById('username-input');
    const pinInput = document.getElementById('pin-input');
    const authError = document.getElementById('auth-error');
    const displayPlayerName = document.getElementById('display-player-name');
    const statHighScore = document.getElementById('stat-high-score');
    const statCareerScore = document.getElementById('stat-career-score');
    const btnLogout = document.getElementById('btn-logout');

    const categoryBadge = document.getElementById('category-badge');
    const timerDisplay = document.getElementById('timer');
    const questionText = document.getElementById('question-text');
    const playerImageContainer = document.getElementById('player-image-container');
    const playerQuestionImage = document.getElementById('player-question-image');
    const optionsContainer = document.getElementById('options-container');
    const statusMessage = document.getElementById('status-message');
    const resultFeedback = document.getElementById('result-feedback');
    const playerRankDisplay = document.getElementById('player-rank-display');
    const playerCorrectAnswer = document.getElementById('player-correct-answer');
    const answerRevealWrapper = document.getElementById('answer-reveal-wrapper');
    const playerPodiumArea = document.getElementById('player-podium-area');
    const leaderboardList = document.getElementById('leaderboard-list');

    const savedUser = localStorage.getItem('trivia_user');
    const savedPin = localStorage.getItem('trivia_pin');
    if (savedUser && savedPin) {
      socket.emit('player:auth', { username: savedUser, pin: savedPin });
    }

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      authError.style.display = 'none';
      const username = usernameInput.value.trim();
      const pin = pinInput.value.trim();
      haptic(30);
      socket.emit('player:auth', { username, pin });
    });

    socket.on('player:auth_error', (msg) => {
      authError.textContent = msg;
      authError.style.display = 'block';
      haptic([80, 50, 80]); // Error vibration pattern
    });

    socket.on('player:authenticated', (data) => {
      localStorage.setItem('trivia_user', data.username);
      localStorage.setItem('trivia_pin', pinInput.value.trim() || savedPin);

      displayPlayerName.textContent = data.username;
      statHighScore.textContent = Number(data.highScore).toLocaleString() + ' pts';
      statCareerScore.textContent = Number(data.careerScore).toLocaleString() + ' pts';

      joinScreen.classList.add('hidden');
      lobbyScreen.classList.remove('hidden');
    });

    btnLogout.addEventListener('click', () => {
      localStorage.removeItem('trivia_user');
      localStorage.removeItem('trivia_pin');
      window.location.reload();
    });

    socket.on('game:new_question', (data) => {
      selectedAnswer = null;
      lobbyScreen.classList.add('hidden');
      resultsScreen.classList.add('hidden');
      playerPodiumArea.classList.add('hidden');
      answerRevealWrapper.classList.remove('hidden');
      gameScreen.classList.remove('hidden');

      categoryBadge.textContent = `${data.category} (${data.questionNumber}/${data.totalQuestions})`;
      timerDisplay.textContent = data.timeLeft;
      questionText.textContent = data.question;
      statusMessage.classList.add('hidden');

      if (data.image) {
        playerQuestionImage.src = data.image;
        playerImageContainer.classList.remove('hidden');
      } else {
        playerQuestionImage.src = '';
        playerImageContainer.classList.add('hidden');
      }

      optionsContainer.innerHTML = '';
      data.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          if (selectedAnswer !== null) return;
          selectedAnswer = index;
          haptic(40); // Quick tactile confirmation tap
          btn.classList.add('selected');
          Array.from(optionsContainer.children).forEach(b => b.disabled = true);
          statusMessage.classList.remove('hidden');
          socket.emit('player:submit_answer', index);
        });
        optionsContainer.appendChild(btn);
      });
    });

    socket.on('game:timer_tick', (timeLeft) => {
      timerDisplay.textContent = timeLeft;
    });

    socket.on('game:round_ended', (data) => {
      gameScreen.classList.add('hidden');
      resultsScreen.classList.remove('hidden');

      playerCorrectAnswer.textContent = data.correctAnswerText;
      if (data.myRank) playerRankDisplay.textContent = `#${data.myRank}`;

      if (selectedAnswer === data.correctAnswer) {
        resultFeedback.textContent = `Correct! +${data.myPointsEarned} pts`;
        resultFeedback.style.color = "#10b981";
        haptic([40, 60, 80]); // Positive feedback
      } else if (selectedAnswer === null) {
        resultFeedback.textContent = "Time's up! +0 pts";
        resultFeedback.style.color = "#f59e0b";
        haptic([70, 40, 70]);
      } else {
        resultFeedback.textContent = "Incorrect! +0 pts";
        resultFeedback.style.color = "#ef4444";
        haptic(150); // Negative feedback buzz
      }

      renderLeaderboard(data.leaderboard);
    });

    socket.on('game:over', (data) => {
      gameScreen.classList.add('hidden');
      resultsScreen.classList.remove('hidden');
      answerRevealWrapper.classList.add('hidden');

      const leaderboard = Array.isArray(data) ? data : data.leaderboard;
      const myRank = data.myRank;

      if (myRank) {
        playerRankDisplay.textContent = `#${myRank}`;
        resultFeedback.textContent = `Match Finished! You finished #${myRank}`;
      } else {
        resultFeedback.textContent = "Match Finished! Final Standings:";
      }
      resultFeedback.style.color = "#38bdf8";

      // Render player mini podium
      renderPlayerPodium(leaderboard);
      renderLeaderboard(leaderboard);

      // If user finished on the podium (top 3), celebrate with confetti & haptic pulses
      if (myRank && myRank <= 3) {
        haptic([80, 80, 80, 80, 200]);
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.7 }
          });
        }
      }
    });

    function renderPlayerPodium(players) {
      if (!players || players.length === 0) return;
      playerPodiumArea.classList.remove('hidden');
      playerPodiumArea.innerHTML = '';

      const p1 = players[0] || null;
      const p2 = players[1] || null;
      const p3 = players[2] || null;

      let html = '';
      if (p2) html += `<div class="p-slot second"><span class="p-icon">🥈</span><span class="p-name">${p2.name}</span><div class="p-step">2</div></div>`;
      if (p1) html += `<div class="p-slot first"><span class="p-icon">👑</span><span class="p-name">${p1.name}</span><div class="p-step">1</div></div>`;
      if (p3) html += `<div class="p-slot third"><span class="p-icon">🥉</span><span class="p-name">${p3.name}</span><div class="p-step">3</div></div>`;

      playerPodiumArea.innerHTML = html;
    }

    function renderLeaderboard(players) {
      leaderboardList.innerHTML = '';
      players.forEach((p, idx) => {
        const li = document.createElement('li');
        const isMe = p.id === socket.id;
        li.style.border = isMe ? '2px solid #38bdf8' : 'none';
        li.innerHTML = `<span>#${idx + 1} ${p.name} ${isMe ? '(You)' : ''}</span><strong>${p.score} pts</strong>`;
        leaderboardList.appendChild(li);
      });
    }
  </script>
</body>
</html>
