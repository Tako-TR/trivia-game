<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Trivia Question</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .container {
      max-width: 650px;
    }
    .form-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 1.5rem;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      text-align: left;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .form-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input[type="text"], input[type="password"], select {
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }
    input:focus, select:focus {
      outline: 2px solid #38bdf8;
      border-color: transparent;
    }
    .options-setup {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .option-row input[type="radio"] {
      width: 1.25rem;
      height: 1.25rem;
      accent-color: #10b981;
      cursor: pointer;
    }
    .option-row input[type="text"] {
      flex: 1;
    }
    .hint-text {
      font-size: 0.75rem;
      color: #64748b;
    }
    .status-alert {
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .status-success {
      background-color: #064e3b;
      color: #6ee7b7;
      border: 1px solid #10b981;
    }
    .status-error {
      background-color: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #ef4444;
    }
    .btn-submit {
      background-color: #10b981;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Question Creator</h1>
    <p class="question-text" style="margin-bottom: 1.25rem;">Add questions to your live game database</p>

    <div id="status-box" class="status-alert"></div>

    <form id="question-form" class="form-card">
      <!-- Admin Passcode -->
      <div class="form-group">
        <label for="admin-pass">Host Passcode</label>
        <input type="password" id="admin-pass" placeholder="Default is admin123" required>
        <span class="hint-text">Set your passcode to prevent unauthorized entries.</span>
      </div>

      <!-- Category & Difficulty Row -->
      <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
        <div class="form-group" style="flex: 1; min-width: 180px;">
          <label for="q-category">Category</label>
          <select id="q-category">
            <option value="Bible">Bible</option>
            <option value="Movie Quotes">Movie Quotes</option>
            <option value="Logos">Logos</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1; min-width: 180px;">
          <label for="q-difficulty">Difficulty</label>
          <select id="q-difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>
      </div>

      <!-- Question Text -->
      <div class="form-group">
        <label for="q-text">Question Prompt</label>
        <input type="text" id="q-text" placeholder="e.g. Which character said..." required>
      </div>

      <!-- Image URL (Optional) -->
      <div class="form-group">
        <label for="q-image">Image URL (Optional)</label>
        <input type="text" id="q-image" placeholder="https://example.com/logo.svg">
        <span class="hint-text">Leave blank if the question has no picture.</span>
      </div>

      <!-- Options & Radio Selector for Correct Answer -->
      <div class="form-group">
        <label>Options (Select the correct answer dot)</label>
        <div class="options-setup">
          <div class="option-row">
            <input type="radio" name="correct-opt" value="0" checked>
            <input type="text" id="opt-0" placeholder="Option 1" required>
          </div>
          <div class="option-row">
            <input type="radio" name="correct-opt" value="1">
            <input type="text" id="opt-1" placeholder="Option 2" required>
          </div>
          <div class="option-row">
            <input type="radio" name="correct-opt" value="2">
            <input type="text" id="opt-2" placeholder="Option 3" required>
          </div>
          <div class="option-row">
            <input type="radio" name="correct-opt" value="3">
            <input type="text" id="opt-3" placeholder="Option 4" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">Add Question</button>
      <a href="/host.html" style="color: #38bdf8; text-align: center; text-decoration: none; margin-top: 0.5rem; font-weight: 600;">Return to Host Screen</a>
    </form>
  </div>

  <script>
    const form = document.getElementById('question-form');
    const statusBox = document.getElementById('status-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('admin-pass').value;
      const category = document.getElementById('q-category').value;
      const difficulty = document.getElementById('q-difficulty').value;
      const question = document.getElementById('q-text').value;
      const image = document.getElementById('q-image').value;

      const options = [
        document.getElementById('opt-0').value,
        document.getElementById('opt-1').value,
        document.getElementById('opt-2').value,
        document.getElementById('opt-3').value
      ];

      const selectedRadio = document.querySelector('input[name="correct-opt"]:checked');
      const answer = selectedRadio ? parseInt(selectedRadio.value, 10) : 0;

      statusBox.style.display = 'none';

      try {
        const response = await fetch('/api/questions/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password,
            category,
            difficulty,
            question,
            options,
            answer,
            image
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          statusBox.textContent = `Question saved! (Pool size: ${data.totalQuestions})`;
          statusBox.className = 'status-alert status-success';
          statusBox.style.display = 'block';

          // Reset inputs while keeping password and category
          document.getElementById('q-text').value = '';
          document.getElementById('q-image').value = '';
          document.getElementById('opt-0').value = '';
          document.getElementById('opt-1').value = '';
          document.getElementById('opt-2').value = '';
          document.getElementById('opt-3').value = '';
        } else {
          statusBox.textContent = data.message || 'Error saving question.';
          statusBox.className = 'status-alert status-error';
          statusBox.style.display = 'block';
        }
      } catch (err) {
        statusBox.textContent = 'Network or server error.';
        statusBox.className = 'status-alert status-error';
        statusBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
